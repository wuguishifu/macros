<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d9e0"/>
      <stop offset="1" stop-color="#9c9ca8"/>
    </linearGradient>
    <linearGradient id="skirtSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4ea"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.08"/>
    </radialGradient>
    <radialGradient id="rec" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.55" stop-color="#f2342a"/>
      <stop offset="1" stop-color="#c41810"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="topShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3a3a48" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="engrave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#fff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- keycap skirt (macOS icon grid: 824px body, 100px inset) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#skirt)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#skirtSide)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- keycap top face -->
  <g>
    <rect x="166" y="176" width="692" height="672" rx="132" fill="url(#top)"/>
  </g>
  <rect x="166" y="176" width="692" height="672" rx="132" fill="url(#dish)"/>
  <!-- <rect x="167.5" y="177.5" width="689" height="669" rx="131" fill="none" stroke="#fff" stroke-width="3"/> -->

  <!-- @ glyph -->
  <g transform="translate(12,44)" filter="url(#engrave)" fill="none" stroke="#26262e" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="500" cy="478" r="86"/>
    <path d="M 586 392 L 586 520 C 586 578 712 590 712 478 A 212 212 0 1 0 630 646"/>
  </g>

  <!-- recording dot -->
  <circle cx="752" cy="282" r="50" fill="#ff2a1f" opacity="0.55" filter="url(#glow)"/>
  <circle cx="752" cy="282" r="46" fill="url(#rec)"/>
  <circle cx="752" cy="282" r="45" fill="none" stroke="#8a0e08" stroke-opacity="0.35" stroke-width="2"/>
</svg>