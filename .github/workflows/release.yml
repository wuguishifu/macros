name: Release

run-name: Release (${{ inputs.version-bump-type }})

on:
  workflow_dispatch:
    inputs:
      version-bump-type:
        description: Version bump type
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be made from main, not ${{ github.ref_name }}"
          exit 1

      - name: checkout
        uses: actions/checkout@v4

      - name: bump version
        id: version
        uses: wuguishifu/version-bump-workflow@v1
        with:
          bump-type: ${{ inputs.version-bump-type }}

  # Signs and notarizes. Has the signing secrets but no write access to the repo.
  build:
    needs: [ci, version]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        uses: ./.github/actions/setup-macos

      - name: import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode >"$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -t cert \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$CERT"

          # Developer ID intermediates (G1 and G2), in case the image lacks them.
          for CA in DeveloperIDCA DeveloperIDG2CA; do
            if curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"; then
              security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" || true
            else
              echo "::warning::Couldn't download $CA intermediate certificate"
            fi
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend ours to the search list; existing entries are intentionally word-split (no spaces in them).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: write notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" >"$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"

      - name: build, sign and notarize
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: pnpm nx run mac:release

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macros-release
          if-no-files-found: error
          path: |
            dist/apps/mac/release/Macros-*.dmg
            dist/apps/mac/release/Macros-*.zip

      - name: clean up signing material
        if: always()
        env:
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$NOTARY_KEY"

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    # write: creating the release creates the vX.Y.Z tag
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macros-release
          path: release

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Macros $VERSION" \
            --generate-notes
